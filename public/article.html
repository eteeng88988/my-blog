<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Article</title>
    <link rel="icon" href="/assets/logo.svg">
    <link rel="alternate" type="application/rss+xml" title="My Blog RSS" href="/feed.xml">
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">
        <img src="/assets/logo.svg" alt="">
        <span data-site-title>My Blog</span>
      </a>
      <nav class="nav" data-menu></nav>
      <div class="header-actions">
        <button class="icon-button" data-theme-toggle title="Toggle dark mode">◐</button>
      </div>
    </header>
    <main class="article-shell">
      <section class="ad-region" data-ad-slot="global-top" hidden></section>
      <article class="article card" data-article>Loading...</article>
    </main>
    <section class="ad-region ad-region-wide" data-ad-slot="footer" hidden></section>
    <footer class="site-footer">
      <span data-site-footer>2026 My Blog</span>
      <a href="/feed.xml">RSS</a>
      <a href="/sitemap.xml">Sitemap</a>
    </footer>
    <script src="/assets/article.js" type="module"></script>
  </body>
</html>
