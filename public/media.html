<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>媒体库</title>
    <link rel="icon" href="/assets/logo.svg">
    <link rel="alternate" type="application/rss+xml" title="My Blog RSS" href="/feed.xml">
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">
        <img src="/assets/logo.svg" alt="">
        <span data-site-title>My Blog</span>
      </a>
      <nav class="nav" data-menu></nav>
      <div class="header-actions">
        <button class="icon-button" data-theme-toggle title="切换深色模式">◐</button>
      </div>
    </header>
    <main class="article-shell">
      <section class="ad-region" data-ad-slot="global-top" hidden></section>
      <section class="article card">
        <a class="article-back" href="/">返回首页</a>
        <h1>媒体库</h1>
        <section class="ad-region" data-ad-slot="content-list" hidden></section>
        <div class="media-grid" data-media-grid></div>
      </section>
    </main>
    <section class="ad-region ad-region-wide" data-ad-slot="footer" hidden></section>
    <footer class="site-footer">
      <span data-site-footer>2026 My Blog</span>
      <nav data-footer-links>
        <a href="/feed.xml">RSS</a>
        <a href="/sitemap.xml">Sitemap</a>
      </nav>
      <div data-footer-html></div>
    </footer>
    <script src="/assets/media.js" type="module"></script>
  </body>
</html>
