<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>归档</title>
    <link rel="icon" href="/assets/logo.svg">
    <link rel="alternate" type="application/rss+xml" title="My Blog RSS" href="/feed.xml">
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">
        <img src="/assets/logo.svg" alt="">
        <span data-site-title>My Blog</span>
      </a>
      <nav class="nav" data-menu></nav>
      <div class="header-actions">
        <button class="icon-button" data-theme-toggle title="切换深色模式">◐</button>
      </div>
    </header>

    <main class="article-shell">
      <section class="article card">
        <a class="article-back" href="/">返回首页</a>
        <h1>归档</h1>
        <div class="archive-summary" data-archive-summary></div>
        <div class="archive-layout">
          <section>
            <h2>时间线</h2>
            <div class="archive-list" data-archive-list></div>
          </section>
          <aside>
            <h2>分类</h2>
            <div class="archive-cloud" data-category-cloud></div>
            <h2>标签</h2>
            <div class="archive-cloud" data-tag-cloud></div>
          </aside>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span data-site-footer>2026 My Blog</span>
      <a href="/feed.xml">RSS</a>
      <a href="/sitemap.xml">Sitemap</a>
    </footer>

    <script src="/assets/archive.js" type="module"></script>
  </body>
</html>
