<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Blog</title>
    <meta name="description" content="一个由 GitHub 和 Cloudflare 驱动的个人博客。">
    <link rel="icon" href="/assets/logo.svg">
    <link rel="alternate" type="application/rss+xml" title="My Blog RSS" href="/feed.xml">
    <link rel="sitemap" type="application/xml" href="/sitemap.xml">
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">
        <img src="/assets/logo.svg" alt="">
        <span data-site-title>My Blog</span>
      </a>
      <nav class="nav" data-menu></nav>
      <div class="header-actions">
        <button class="icon-button" data-search-open title="搜索">⌕</button>
        <button class="icon-button" data-theme-toggle title="切换深色模式">◐</button>
      </div>
    </header>

    <main>
      <section class="ad-region ad-region-wide" data-ad-slot="global-top" hidden></section>

      <section class="hero" data-hero>
        <div class="hero-content">
          <p class="eyebrow" data-site-eyebrow></p>
          <h1 data-site-subtitle>记录技术、想法和项目进展</h1>
          <p data-site-description>一个由 GitHub 和 Cloudflare 驱动的个人博客。</p>
        </div>
      </section>

      <section class="category-directory" id="categories">
        <div class="section-title">
          <h2>分类目录</h2>
          <span>按大类快速筛选内容</span>
        </div>
        <div class="category-tree" data-category-tree></div>
      </section>

      <section class="layout" id="posts">
        <div class="feed">
          <div class="section-title">
            <h2>最新文章</h2>
            <span data-post-count>0 篇</span>
          </div>
          <section class="ad-region" data-ad-slot="home-top" hidden></section>
          <section class="ad-region" data-ad-slot="category-top" hidden></section>
          <section class="ad-region" data-ad-slot="subcategory-top" hidden></section>
          <div class="post-list" data-posts></div>
          <section class="ad-region" data-ad-slot="content-list" hidden></section>
        </div>

        <aside class="sidebar">
          <section class="profile card">
            <img class="avatar" data-sidebar-avatar alt="">
            <h3 data-sidebar-name>Lexiao</h3>
            <p data-sidebar-bio></p>
            <div class="stats">
              <span><strong data-stat-posts>0</strong>文章</span>
              <span><strong data-stat-tags>0</strong>标签</span>
              <span><strong data-stat-cats>0</strong>分类</span>
            </div>
            <div class="profile-links">
              <div data-sidebar-links></div>
            </div>
            <div class="profile-custom" data-sidebar-custom></div>
          </section>
          <section class="card notice">
            <h3>公告</h3>
            <p data-sidebar-notice></p>
          </section>
          <section class="ad-region sidebar-ad-region" data-ad-slot="sidebar-notice" hidden></section>
          <section class="card">
            <h3>分类目录</h3>
            <div class="category-tree sidebar-category-tree" data-sidebar-category-tree></div>
          </section>
          <section class="card">
            <h3>标签</h3>
            <div class="tag-cloud" data-tags></div>
          </section>
        </aside>
      </section>
    </main>

    <section class="ad-region ad-region-wide" data-ad-slot="footer" hidden></section>

    <footer class="site-footer">
      <span data-site-footer>2026 My Blog</span>
      <nav data-footer-links>
        <a href="/feed.xml">RSS</a>
        <a href="/sitemap.xml">Sitemap</a>
      </nav>
      <div data-footer-html></div>
    </footer>

    <dialog class="search-dialog" data-search-dialog>
      <form method="dialog">
        <button class="icon-button close" title="关闭">×</button>
      </form>
      <input data-search-input placeholder="搜索文章标题、摘要、标签">
      <div class="search-results" data-search-results></div>
    </dialog>

    <button class="back-top" data-back-top title="返回顶部">↑</button>
    <script src="/assets/protection.js" defer></script>
    <script src="/assets/app.js" type="module"></script>
  </body>
</html>
