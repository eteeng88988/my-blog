<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>后台密码哈希生成器</title>
    <style>
      body { max-width: 720px; margin: 8vh auto; padding: 24px; font-family: system-ui, sans-serif; line-height: 1.7; }
      label { display: grid; gap: 8px; margin: 18px 0; }
      input, textarea { width: 100%; padding: 12px; font: inherit; box-sizing: border-box; }
      textarea { min-height: 90px; }
      button { padding: 10px 14px; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>后台密码哈希生成器</h1>
    <p>输入你的后台密码，生成 SHA-256。把结果填到 Cloudflare Pages 环境变量 <code>ADMIN_PASSWORD_SHA256</code>。</p>
    <label>后台密码<input id="password" type="password" autocomplete="new-password"></label>
    <button id="generate">生成哈希</button>
    <label>ADMIN_PASSWORD_SHA256<textarea id="hash" readonly></textarea></label>
    <script>
      const encoder = new TextEncoder();
      const toHex = (buffer) => [...new Uint8Array(buffer)].map((byte) => byte.toString(16).padStart(2, "0")).join("");
      document.getElementById("generate").addEventListener("click", async () => {
        const password = document.getElementById("password").value;
        const hash = await crypto.subtle.digest("SHA-256", encoder.encode(password));
        document.getElementById("hash").value = toHex(hash);
      });
    </script>
  </body>
</html>
